[package]
name = "sol-sec-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Ishant Panchal <ishant.p@somaiya.edu>"]
description = "Deterministic pre-execution transaction simulator, compute-budget optimizer, and Anchor error interceptor for Solana"
license = "MIT"

[dependencies]
dotenvy = "0.15"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
bs58 = "0.5"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
overflow-checks = true
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "proxy_benchmark"
harness = false


